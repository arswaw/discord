<!DOCTYPE html>
<html>

<head>
    <title>Discord Conversations</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="uaplus.css">
</head>

<body>
    <script>
        async function fetchList() {
            try {
                const response = await fetch('http://localhost:3000/list');
                // CRITICAL: Always check response.ok. 
                // Fetch does NOT reject on HTTP errors like 404 or 500!
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                return data
            } catch (error) {
                console.error('Network or parsing error:', error);
            }
        }
        async function fetchFolders() {
            try {
                const response = await fetch('http://localhost:3000/folders');
                // CRITICAL: Always check response.ok. 
                // Fetch does NOT reject on HTTP errors like 404 or 500!
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                return data
            } catch (error) {
                console.error('Network or parsing error:', error);
            }
        }
        async function fetchConversation(id) {
            try {
                const response = await fetch(`http://localhost:3000/conversation/${id}`);
                // CRITICAL: Always check response.ok. 
                // Fetch does NOT reject on HTTP errors like 404 or 500!
                if (!response.ok) {
                    throw new Error(`HTTP error! Status: ${response.status}`);
                }

                const data = await response.json();
                return data
            } catch (error) {
                console.error('Network or parsing error:', error);
            }
        }
    </script>
    <script type="importmap">
  {
    "imports": {
      "vue": "https://unpkg.com/vue@3/dist/vue.esm-browser.js",
      "NavBarComponent": "./components/NavBarComponent.js",
      "LoadingComponent": "./components/LoadingComponent.js",
      "ErrorComponent": "./components/ErrorComponent.js",
      "useMouse": "./composables/mouse.js",
      "useFetch": "./composables/fetch.js",
      "injection-keys": "./injection-keys.js"
    }
  }
</script>

    <div id="app">
        <navbar :links="store.nav.links"></navbar>
        <dialog id="my-dialog">
            <button commandfor="my-dialog" command="close">Close</button>
            <p>{{store.selectedConversationName}}</p>
            <li v-for="conversation in store.selectedConversation">
                {{conversation.Contents}}
            </li>
        </dialog>
        <h1>{{ message }}</h1>
        <p highlight>This sentence is important!</p>
        <test text="Comment Identifiers." :ids="store.test.ids">
            Mouse position is at: {{ x }}, {{ y }}
        </test>
        <div class="container">
            <li class="grid-item" v-for="(conversation, index) in conversations">
                <h3>{{conversation}}</h3>
                <button command="show-modal" commandfor="my-dialog" href="#"
                    @click="showFolder(conversation, index)">Open</button>
            </li>
        </div>
    </div>

    <script type="module">
        import { createApp, ref, reactive, provide, defineAsyncComponent } from 'vue'
        import { useMouse } from 'useMouse'
        import { useFetch } from 'useFetch'
        import { myInjectionKey } from 'injection-keys'
        import NavBarComponent from 'NavBarComponent'
        import LoadingComponent from 'LoadingComponent'
        import ErrorComponent from 'ErrorComponent'

        const conversations = await fetchList()
        const folders = await fetchFolders()

        export const store = reactive({
            selectedConversationName: '',
            selectedConversation: [],
            test: {
                "ids": [234, 266, 273]
            },
            providerText: "This content was provided from Vue provider.",
            nav: {
                links: [
                    {
                        display: "Home",
                        link: "#home"
                    },
                    {
                        display: "News",
                        link: "#news"
                    },
                    {
                        display: "Contact",
                        link: "#contact"
                    },
                    {
                        display: "About",
                        link: "#about"
                    }
                ]
            },
            increment() {
                this.count++
            }
        })

        async function showFolder(conversation, index) {
            const record = await fetchConversation(index)
            store.selectedConversationName = conversation
            store.selectedConversation = record
            console.info('folder clicked', record, conversation)
        }

        createApp({
            setup() {
                provide(myInjectionKey, store.providerText)
                const message = ref('Discord Conversations')
                const { x, y } = useMouse()
                const { data, error } = useFetch('https://api.github.com/users/hadley/orgs')
                return {
                    message,
                    conversations,
                    folders,
                    showFolder,
                    store,
                    x, y
                }
            },
            directives: {
                highlight: {
                    mounted: (el) => {
                        el.classList.add('highlight')
                    }
                }
            }
        })
            .component('test', defineAsyncComponent({
                loader: () => import('./components/TestComponent.js'),
                loadingComponent: LoadingComponent,
                errorComponent: ErrorComponent,
                timeout: 3000
            }))
            .component('navbar', NavBarComponent)
            .mount('#app')
    </script>
</body>

</html>
